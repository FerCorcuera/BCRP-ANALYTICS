[project]
name = "bcrp-analytics"
version = "0.1.0"
description = "Analytics toolkit for BCRP data"

authors = [
    { name = "Fernando Corcuera", email = "fercorcuera21@gmail.com" }
]

license = "MIT"
readme = "README.md"

requires-python = ">=3.11,<4.0"

dependencies = [
    "pandas>=2.2,<3.0",
    "requests>=2.31,<3.0"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]

dev = [
    "pre-commit>=4.6,<5.0",
]

research = [
    "numpy>=1.26,<2.0",
    "matplotlib>=3.8,<4.0",
    "statsmodels>=0.14,<0.15",
    "catppuccin>=2.5,<3.0",
    "jupyter>=1.1,<2.0",
    "ipykernel>=7.2,<8.0"
]

[tool.poetry]
packages = [{ include = "bcrp_analytics" }]
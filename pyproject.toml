[project]
name = "bcrp-analytics"
version = "0.1.0"
description = "Analytics toolkit for BCRP data"
authors = [
    {name = "Fernando Corcuera/fercorcuera21@gmail.com"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pandas (>=3.0.3,<4.0.0)",
    "numpy (>=2.4.5,<3.0.0)",
    "matplotlib (>=3.10.9,<4.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "catppuccin (>=2.5.0,<3.0.0)",
    "statsmodels (>=0.14.6,<0.15.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pre-commit (>=4.6.0,<5.0.0)",
    "jupyter (>=1.1.1,<2.0.0)",
    "ipykernel (>=7.2.0,<8.0.0)"
]

[tool.poetry]
packages = [{ include = "bcrp_analytics" }]